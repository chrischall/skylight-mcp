version: 1
name: Skylight
slug: skylight
summary: >-
  Skylight Calendar MCP — read/write family calendar events, chores,
  rewards, and shared lists via Claude. Auth via email+password.
env:
  - name: SKYLIGHT_REFRESH_TOKEN
    secret: true
    required: false
    help: >-
      An OAuth refresh token you already hold. Supply this and no password is
      needed — the four-step login is skipped entirely, which also leaves the
      rate-limited login endpoint untouched on a cold start.
  - name: SKYLIGHT_EMAIL
    required: false
    help: >-
      Skylight account email. Pair with SKYLIGHT_PASSWORD for direct login.
      Needed only if you are not supplying SKYLIGHT_REFRESH_TOKEN.
  - name: SKYLIGHT_PASSWORD
    secret: true
    required: false
    help: >-
      Skylight account password — required iff SKYLIGHT_EMAIL is set.
  - name: SKYLIGHT_FRAME_ID
    required: false
    help: >-
      Optional: pick a specific Skylight frame when the account has more than
      one.
  - name: SKYLIGHT_NAME
    required: false
    help: >-
      Friendly account name used in startup logs.
  - name: SKYLIGHT_TOKEN_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk token cache and log in on every
      process start. Defaults to enabled.
  - name: SKYLIGHT_TOKEN_FILE
    required: false
    help: >-
      Absolute path for the token cache file. Defaults to
      $MCP_DATA_DIR/.skylight-mcp/tokens.json.
state:
  dataDir: true
  reason: >-
    Keeps the OAuth token pair at $MCP_DATA_DIR/.skylight-mcp/tokens.json (0600)
    so a restart reuses it. Without it every cold start re-runs the four-step
    authorization-code login, and Skylight's login endpoint rate-limits — on a
    scale-to-zero host, where every start is a cold one, that is the difference
    between a free start and a throttled one. Only the tokens are written; the
    credentials stay in the environment (the cache is bound by a salted digest to
    whichever credential minted the pair — the password pair or a supplied
    SKYLIGHT_REFRESH_TOKEN — so replacing it discards the cache).
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - amazonaws.com
    - app.ourskylight.com
    - ourskylight.com
    #
    # NOTE — this server also reaches at least one host determined at
    # RUNTIME, which cannot appear as a literal here:
    #   - a base URL taken from config rather than a literal
    # Confirm the concrete host(s) against a live run and add them, or
    # the isolated tier will block the call.
