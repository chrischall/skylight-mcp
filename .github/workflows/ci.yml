name: CI

# Thin stub — the gate and steps live in chrischall/workflows.
# Status-mode gate: un-armed PRs are blocked by a yellow `ci-gated: pending`
# commit status (the `ci / ci` job is skipped, not a red or misleadingly green
# job); the repo ruleset must require the `ci-gated` status context
# (scripts/update-ruleset.sh flips it from `ci / ci`).
# The permissions block is load-bearing: the reusable workflow posts the
# `ci-gated` status with this token, and (a) callers pass read-only by default,
# (b) dependabot-triggered runs are read-only unless permissions are explicit.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # A manual gate, for when the automatic one does not arrive. On 2026-08-26
  # GitHub stopped creating `pull_request` runs for skylight-mcp entirely — CI
  # and the auto-review both went silent across three pushes and a reopen,
  # while `auto-merge.yml` kept firing because it is `pull_request_target`. The
  # workflow files were valid and unchanged since they last ran hours earlier,
  # so nothing in the repo could be fixed to bring them back, and PRs sat
  # ungated with no way to run CI at all.
  #
  # Safe because the reusable workflow already handles a non-PR event: it runs
  # CI unconditionally ("non-PR event → run CI") and CANNOT post `ci-gated` —
  # that step is guarded on `github.event_name == 'pull_request'`. So a
  # dispatch runs the real build and tests for any ref and reports through the
  # run itself, never through a commit status, and can never arm a PR.
  #
  # Opt-in per repo via `ci_dispatch` in fleet.json; this block is removed
  # entirely when it is unset.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  ci:
    uses: chrischall/workflows/.github/workflows/reusable-mcp-ci.yml@main
    with:
      node-version: "26"
      build-command: npm run build
      test-command: npm run test:coverage
      gate-mode: status
